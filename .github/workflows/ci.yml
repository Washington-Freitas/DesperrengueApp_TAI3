name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Links da documentação (Markdown)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Verificar links relativos dos .md
        run: node scripts/check-md-links.mjs

  functions:
    name: Dossiê de Despedida (PDF)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Testar a geração do PDF (pdf-lib, sem Deno)
        run: node scripts/test-dossie.mjs

  flutter:
    name: Analyze & Test (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versões
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes (com cobertura)
        run: flutter test --coverage

      - name: Publicar cobertura (lcov)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore
